version: "3.7"

services:

  pozos-website:
    hostname: pozos-website
    image: php:apache
    container_name: "pozos-website"
    volumes:
      - ./website:/var/www/html
    environment:
      USERNAME: "toto"
      PASSWORD: "python"
    networks:
      - pozos
    ports:
      - 8080:80
    depends_on:
      - pozos-api

  pozos-api:
    hostname: pozos-api
    image: pozos-api:0.1
    container_name: "pozos-api"
    volumes:
      - ./simple_api/student_age.json:/data/student_age.json
    networks:
      - pozos

networks:
  pozos:
    name: pozos